# Test every supported Python version, including AlmaLinux 9's Python 3.9.
# Tests use fixtures and mocks: no public RDAP/DNS access or secrets required.
name: Python compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: python-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter version
        run: python --version

      - name: Check Python syntax
        run: python -m compileall -q zwhois zwhois_lib tests

      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v

      - name: Check CLI startup and help
        run: |
          python zwhois --version
          python zwhois --help > /dev/null
